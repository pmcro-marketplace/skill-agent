name: YAML to Agent Skills

on:
  push:
    branches: ["claude/yaml-to-agent-skills"]
    paths:
      - "skills/yaml-to-agent-skills/**"
      - "tests/test_yaml_to_agent_skills.py"
      - ".github/workflows/yaml-to-agent-skills.yml"
  pull_request:
    paths:
      - "skills/yaml-to-agent-skills/**"
      - "tests/test_yaml_to_agent_skills.py"
      - ".github/workflows/yaml-to-agent-skills.yml"
  workflow_call:
    inputs:
      source_yaml:
        required: true
        type: string
      output_dir:
        required: false
        type: string
        default: dist/yaml-to-agent-skills
  workflow_dispatch:
    inputs:
      source_yaml:
        description: YAML or JSON source inventory to convert
        required: false
        default: skills/yaml-to-agent-skills/assets/example.yaml
      output_dir:
        description: Candidate skill output directory
        required: false
        default: dist/yaml-to-agent-skills

permissions:
  contents: read

jobs:
  convert-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install YAML parser
        run: python -m pip install pyyaml

      - name: Unit-test converter
        run: python -m unittest tests/test_yaml_to_agent_skills.py -v

      - name: Select source and output
        id: io
        shell: bash
        env:
          SOURCE_INPUT: "${{ inputs.source_yaml }}"
          OUT_INPUT: "${{ inputs.output_dir }}"
        run: |
          SOURCE="$SOURCE_INPUT"
          OUT="$OUT_INPUT"
          if [ -z "$SOURCE" ]; then SOURCE="skills/yaml-to-agent-skills/assets/example.yaml"; fi
          if [ -z "$OUT" ]; then OUT="dist/yaml-to-agent-skills"; fi
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Convert declared capabilities
        run: |
          rm -rf "${{ steps.io.outputs.out }}"
          mkdir -p dist
          python skills/yaml-to-agent-skills/scripts/convert.py \
            --source "${{ steps.io.outputs.source }}" \
            --out "${{ steps.io.outputs.out }}" \
            --existing-root skills \
            --report dist/yaml-to-agent-skills-report.json

      - name: Validate every generated Layer 0 skill
        shell: bash
        run: |
          count=0
          while IFS= read -r -d '' skill; do
            count=$((count+1))
            python skills/validate/scripts/validate_plugin.py --skill "$skill" --profile pmcro
            python "$skill/scripts/validate.py"
          done < <(find "${{ steps.io.outputs.out }}" -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)
          if [ "$count" -eq 0 ]; then
            echo "No new skills generated; all discovered identities were reused."
          fi

      - name: Show conversion report
        run: cat dist/yaml-to-agent-skills-report.json

      - name: Upload candidate skills
        uses: actions/upload-artifact@v4
        with:
          name: yaml-to-agent-skills
          path: |
            ${{ steps.io.outputs.out }}
            dist/yaml-to-agent-skills-report.json
